services:
    _defaults:
        autowire: true
        autoconfigure: true
    _instanceof:
        Symfony\Component\Console\Command\Command:
            tags: ['command']

    Atoolo\Search\Console\Command\Search:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_search.search'

    Atoolo\Search\Console\Command\Suggest:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_search.suggest'

    Atoolo\Search\Console\Command\MoreLikeThis:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_search.more_like_this'

    # --- Deprecated commands, removed in 2.0 ---------------------------

    Atoolo\Search\Console\Command\Indexer:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_index.indexer.console.progress_bar'
        - '@atoolo_index.indexer.indexer_collection'

    Atoolo\Search\Console\Command\IndexerInternalResourceUpdate:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_index.indexer.console.progress_bar'
        - '@atoolo_index.indexer.indexer_collection'

    Atoolo\Search\Console\Command\DumpIndexDocument:
      arguments:
        - '@atoolo_resource.resource_channel'
        - '@atoolo_index.indexer.index_document_dumper_collection'

    atoolo_search.indexer.console.progress_bar:
      alias: atoolo_index.indexer.console.progress_bar
      deprecated:
        package: 'atoolo/search-bundle'
        version: '1.18'
        message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.console.progress_bar" instead.'

    Atoolo\Search\Console\Application:
        alias: Atoolo\Index\Console\Application
        public: true
        deprecated:
          package: 'atoolo/search-bundle'
          version: '1.18'
          message: 'The "%alias_id%" service is deprecated, use "Atoolo\Index\Console\Application" instead.'
