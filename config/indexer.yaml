parameters:
  atoolo_search.indexer.internal_resource_indexer_scheduler.cron: '0 2 * * *' # cron expression, every day at 2:00

services:

  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # --- Solr specific services -------------------------------------------

  atoolo_search.indexer.solr_index_service:
    class: Atoolo\Search\Service\Indexer\SolrIndexService
    arguments:
      - '@atoolo_index.index_name'
      - '@atoolo_search.solarium_client_factory'

  atoolo_search.indexer.schema2x_document_factory:
    class: Atoolo\Search\Service\Indexer\Schema2xIndexDocumentFactory

  Atoolo\Search\Service\Indexer\SiteKit\DefaultSchema2xDocumentEnricher:
    arguments:
      - '@atoolo_resource.navigation_hierarchy_loader'
      - '@atoolo_index.indexer.content_collector.sitekit'
      - '@atoolo_search.indexer.solr_index_service'
    tags:
      - { name: 'atoolo_search.indexer.document_enricher.schema2x', priority: 100 }

  atoolo_search.indexer.index_document_dumper:
    class: Atoolo\Index\Service\Indexer\IndexDocumentDumper
    arguments:
      - '@atoolo_resource.resource_loader'
      - !tagged_iterator { tag: 'atoolo_search.indexer.document_enricher.schema2x' }
      - '@atoolo_search.indexer.schema2x_document_factory'
      - 'internal'
    tags:
      - { name: 'atoolo_index.indexer.document_dumper' }

  atoolo_search.indexer.internal_resource_progress_state:
    class: Atoolo\Index\Service\Indexer\IndexerProgressState
    arguments:
      - '@atoolo_index.index_name'
      - '@atoolo_index.indexer.status_store'
      - 'internal'

  atoolo_search.indexer.internal_resource_indexer:
    class: Atoolo\Index\Service\Indexer\InternalResourceIndexer
    arguments:
      - !tagged_iterator atoolo_search.indexer.document_enricher.schema2x
      - '@atoolo_index.indexer.resource_filter'
      - '@atoolo_search.indexer.internal_resource_progress_state'
      - '@atoolo_index.indexer.location_finder'
      - '@atoolo_resource.resource_loader'
      - '@atoolo_search.indexer.solr_index_service'
      - '@atoolo_index.indexer.aborter'
      - '@atoolo_index.indexer.configuration_loader'
      - 'internal'
      - '@atoolo_index.index_name'
      # the solr indexer stays available even without
      # configs/indexer/internal.php, as it was before 1.18
      - true
      - '@atoolo_index.indexer.php_limit_increaser'
      - '@logger'
    tags:
      - { name: 'atoolo_index.indexer', priority: 20 }

  atoolo_search.indexer.internal_resource_indexer_scheduler:
    class: Atoolo\Search\Service\Indexer\InternalResourceIndexerScheduler
    arguments:
      - '%atoolo_search.indexer.internal_resource_indexer_scheduler.cron%'
      - '@atoolo_search.indexer.internal_resource_indexer'

  atoolo_search.indexer.solr_xml_reader:
    class: Atoolo\Search\Service\Indexer\SolrXmlReader
    arguments:
      - '@atoolo_resource.resource_channel'

  # --- Deprecated aliases -----------------------------------------------
  # The generic indexer services moved to atoolo/index-bundle.
  # Removed in 2.0.

  atoolo_search.indexer.php_limit_increaser:
    alias: atoolo_index.indexer.php_limit_increaser
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.php_limit_increaser" instead.'

  atoolo_search.indexer.content_collector.sitekit:
    alias: atoolo_index.indexer.content_collector.sitekit
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.content_collector.sitekit" instead.'

  atoolo_search.indexer.resource_filter:
    alias: atoolo_index.indexer.resource_filter
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.resource_filter" instead.'

  atoolo_search.indexer.aborter:
    alias: atoolo_index.indexer.aborter
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.aborter" instead.'

  atoolo_search.indexer.location_finder:
    alias: atoolo_index.indexer.location_finder
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.location_finder" instead.'

  atoolo_search.indexer.status_store:
    alias: atoolo_index.indexer.status_store
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.status_store" instead.'

  atoolo_search.indexer.configuration_loader:
    alias: atoolo_index.indexer.configuration_loader
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.configuration_loader" instead.'

  atoolo_search.indexer.indexer_collection:
    alias: atoolo_index.indexer.indexer_collection
    deprecated:
      package: 'atoolo/search-bundle'
      version: '1.18'
      message: 'The "%alias_id%" service is deprecated, use "atoolo_index.indexer.indexer_collection" instead.'
